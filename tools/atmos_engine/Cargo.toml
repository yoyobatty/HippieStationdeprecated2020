[package]
name = "hippie_atmos"
version = "2.0.0"
edition = "2021"
description = "Hippie's tile atmos engine: works out gas and heat sharing between turfs for SSair"

# No dependencies: it talks to BYOND through two functions it looks up in byondcore.dll itself (see src/lib.rs)
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
panic = "unwind"
