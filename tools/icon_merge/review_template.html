<title>Hippie Sprite Merge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Silkscreen&display=swap">
<style>
/* Layout: sticky filter bar, then one section per tg sheet holding a wrap grid of before/after sprite cards. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --fg: #1d2420;
  --muted: #5d6a63;
  --line: #d7ddd8;
  --accent: #2f7a55;
  --accent-ink: #ffffff;
  --struck: #b4492f;
  --struck-bg: #fbeee9;
  --check-a: #e6e9e6;
  --check-b: #f7f8f6;
  --font-display: "Silkscreen", "JetBrains Mono", ui-monospace, monospace;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141916; --panel: #1c2320; --fg: #e3e9e5; --muted: #98a69e; --line: #2e3833;
    --accent: #5fbf8c; --accent-ink: #0f1512; --struck: #ef8a6f; --struck-bg: #2c1d18;
    --check-a: #262e2a; --check-b: #1f2622; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141916; --panel: #1c2320; --fg: #e3e9e5; --muted: #98a69e; --line: #2e3833;
  --accent: #5fbf8c; --accent-ink: #0f1512; --struck: #ef8a6f; --struck-bg: #2c1d18;
  --check-a: #262e2a; --check-b: #1f2622; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0; letter-spacing: 0.02em; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:focus-visible, .strike:focus-visible, .sheet-strike:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: 13px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.status b { color: var(--struck); }
.intro { padding-block: 16px 4px; max-width: 70ch; color: var(--muted); }
.intro p { margin: 0 0 6px; }
main .wrap { padding-block: 8px 48px; display: flex; flex-direction: column; gap: 22px; }
section.sheet { content-visibility: auto; contain-intrinsic-size: auto 600px; }
.sheet-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding-block: 6px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.sheet-head h2 { font-family: var(--font-mono); font-size: 15px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.sheet-head .note { font-size: 13px; color: var(--muted); flex: 1 1 260px; min-width: 0; }
.sheet-strike { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.sheet-strike[aria-pressed="true"] { border-color: var(--struck); color: var(--struck); background: var(--struck-bg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.is-struck { background: var(--struck-bg); border-color: var(--struck); }
.pair { display: flex; align-items: center; justify-content: center; gap: 8px; }
.pair figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pair figcaption { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.sprite { display: grid; place-items: center; min-width: 64px; min-height: 64px; max-width: 100%; background-color: var(--check-b); background-image: linear-gradient(45deg, var(--check-a) 25%, transparent 25%, transparent 75%, var(--check-a) 75%), linear-gradient(45deg, var(--check-a) 25%, transparent 25%, transparent 75%, var(--check-a) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; border-radius: 4px; }
.sprite img { image-rendering: pixelated; display: block; max-width: 100%; }
.card.is-struck .after img { opacity: 0.35; }
.card.is-struck .before { outline: 2px solid var(--struck); }
.arrow { color: var(--muted); font-family: var(--font-mono); }
.state { font-family: var(--font-mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.types { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.types code { font-family: var(--font-mono); font-size: 11.5px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); margin-right: 4px; }
.tag.new { border-color: var(--accent); color: var(--accent); }
.strike { font: inherit; font-size: 13px; margin-top: auto; border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.strike[aria-pressed="true"] { border-color: var(--struck); color: var(--struck); font-weight: 700; }
.empty { color: var(--muted); padding-block: 24px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: background-color 120ms, border-color 120ms; } }
</style>

<header class="bar">
  <div class="wrap">
    <h1>Sprite merge</h1>
    <div class="filters" role="group" aria-label="Show">
      <button class="chip" id="f-new" data-filter="new" aria-pressed="true">New in game</button>
      <button class="chip" id="f-already" data-filter="already" aria-pressed="false">Already Hippie</button>
      <button class="chip" id="f-all" data-filter="all" aria-pressed="false">All</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</header>

<div class="wrap intro">
  <p>Each card is a tg sprite (left) that the merge replaces with Hippie's sprite of the same state name (right), for every object that uses it. <strong>New in game</strong> are sprites players see as tg art today. Tap <em>Keep tg art</em> on any you don't want; Claude reads your picks into <code>skip.txt</code>.</p>
</div>

<main><div class="wrap" id="list"></div></main>

<script>
const DATA = /*REVIEW_DATA*/[];
const struck = new Map();
let filter = "new";
let db = null;
let saveNote = "Loading your picks…";

function docId(sheet, state) {
  let h = 5381;
  const s = sheet + ":" + state;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return (sheet.replace(/^icons\//, "").replace(/\.dmi$/, "") + "--" + state).replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 80) + "-" + h.toString(36);
}
const isStruck = (sheet, state) => struck.has(docId(sheet, "*")) || struck.has(docId(sheet, state));

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) n.append(kid);
  return n;
}

function typeLine(e) {
  const box = el("div", { class: "types" });
  const list = (label, types, cls) => {
    const p = el("div");
    p.append(el("span", { class: "tag " + cls, text: label }));
    types.slice(0, 2).forEach((t, i) => { if (i) p.append(", "); p.append(el("code", { text: t.split("/").slice(-2).join("/") })); });
    if (types.length > 2) p.append(" +" + (types.length - 2));
    box.append(p);
  };
  if (e.new_types.length) list("changes", e.new_types, "new");
  if (e.already_types.length) list("already", e.already_types, "");
  if (!e.starts) box.append(el("div", { text: "Overlay or later state (open, broken, on…)" }));
  return box;
}

function sprite(b64, cls, label, state) {
  const img = el("img", { src: "data:image/png;base64," + b64, alt: label + " sprite of " + state });
  return el("figure", { class: cls }, el("div", { class: "sprite" }, img), el("figcaption", { text: label }));
}

function render() {
  const list = document.getElementById("list");
  list.replaceChildren();
  let shown = 0;
  for (const s of DATA) {
    const entries = s.states.filter(e => filter === "all" || e.group === filter);
    if (!entries.length) continue;
    shown += entries.length;
    const whole = struck.has(docId(s.sheet, "*"));
    const nNew = s.states.filter(e => e.group === "new").length;
    const note = s.wired
      ? `${s.wired} type${s.wired > 1 ? "s" : ""} already draw from the Hippie sheet. ${nNew} of ${s.states.length} changed sprites are new in game.`
      : `Nothing draws from the Hippie sheet today: all ${s.states.length} changed sprites are new in game.`;
    const sheetBtn = el("button", { class: "sheet-strike", "aria-pressed": String(whole), text: whole ? "Whole sheet keeps tg art" : "Keep tg art for whole sheet" });
    sheetBtn.addEventListener("click", () => toggle(s.sheet, "*"));
    const grid = el("div", { class: "grid" });
    for (const e of entries) {
      const on = isStruck(s.sheet, e.state);
      const btn = el("button", { class: "strike", "aria-pressed": String(on), text: on ? "Keeps tg art" : "Keep tg art" });
      if (whole) btn.disabled = true;
      btn.addEventListener("click", () => toggle(s.sheet, e.state));
      grid.append(el("article", { class: "card" + (on ? " is-struck" : "") },
        el("div", { class: "pair" }, sprite(e.tg, "before", "tg", e.state), el("span", { class: "arrow", text: "→", "aria-hidden": "true" }), sprite(e.hippie, "after", "hippie", e.state)),
        el("div", { class: "state", text: e.state }),
        typeLine(e),
        btn));
    }
    list.append(el("section", { class: "sheet" },
      el("div", { class: "sheet-head" }, el("h2", { text: s.sheet }), el("span", { class: "note", text: note }), sheetBtn),
      grid));
  }
  if (!shown) list.append(el("p", { class: "empty", text: "No sprites in this view." }));
  updateStatus();
}

function updateStatus() {
  const total = DATA.reduce((a, s) => a + s.states.length, 0);
  const nNew = DATA.reduce((a, s) => a + s.states.filter(e => e.group === "new").length, 0);
  const st = document.getElementById("status");
  st.replaceChildren(`${total} changed sprites, ${nNew} new in game · `, el("b", { text: `${struck.size} struck` }), ` · ${saveNote}`);
}

async function toggle(sheet, state) {
  const id = docId(sheet, state);
  if (!db) { saveNote = "Picks can't be saved here: open on claude.ai while signed in"; updateStatus(); return; }
  const was = struck.has(id);
  if (was) struck.delete(id); else struck.set(id, { sheet, state });
  saveNote = "Saving…"; render();
  try {
    const ref = db.collection("strikes").doc(id);
    if (was) await ref.delete(); else await ref.set({ sheet, state });
    saveNote = "Saved";
  } catch (err) {
    if (was) struck.set(id, { sheet, state }); else struck.delete(id);
    saveNote = err && err.code === "permission_denied" ? "You can view but not strike" : "Not saved: " + ((err && err.message) || "try again");
  }
  render();
}

document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.filter;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  render();
  window.scrollTo({ top: 0 });
}));

render();

(async () => {
  const timer = setTimeout(() => { if (!db) { saveNote = "Picks can't be saved here"; updateStatus(); } }, 10000);
  try {
    db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
  } catch (e) { db = null; }
  if (!db) { clearTimeout(timer); saveNote = "Picks can't be saved here: open on claude.ai while signed in"; updateStatus(); return; }
  db.collection("strikes").onSnapshot(snap => {
    clearTimeout(timer);
    struck.clear();
    for (const d of snap.docs) { const v = d.data(); if (v) struck.set(d.id, v); }
    if (saveNote.startsWith("Loading")) saveNote = "Picks save as you tap";
    render();
  }, err => { clearTimeout(timer); saveNote = "Couldn't load picks: " + (err.message || err.code); updateStatus(); });
})();
</script>
