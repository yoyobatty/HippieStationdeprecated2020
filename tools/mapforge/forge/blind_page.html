<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapforge Blind Test</title>
<style>
:root { --bg:#14161c; --panel:#1d2029; --line:#2c3040; --ink:#e4e6ee; --dim:#8a90a2; --acc:#e8b04a; --bad:#e0605a; --good:#5fc28a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, Segoe UI, sans-serif; }
header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { font-size:15px; margin:0 12px 0 0; letter-spacing:.04em; }
.tab { background:none; border:1px solid var(--line); color:var(--dim); padding:5px 14px; border-radius:4px; cursor:pointer; }
.tab.on { color:var(--ink); border-color:var(--acc); }
#count { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
main { padding:16px; }
.pair { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.side { flex:1 1 420px; max-width:900px; border:2px solid var(--line); border-radius:6px; background:#000; cursor:pointer; padding:0; position:relative; }
.side:hover { border-color:var(--acc); }
.side img { width:100%; display:block; image-rendering:pixelated; }
.side .k { position:absolute; top:6px; left:8px; background:#000b; padding:1px 7px; border-radius:3px; color:var(--dim); font-size:12px; }
.q { text-align:center; color:var(--dim); margin:0 0 12px; }
.q b { color:var(--ink); }
#tagwrap { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
#tagbox { position:relative; max-width:900px; flex:1 1 520px; border:2px solid var(--line); border-radius:6px; background:#000; }
#tagbox img { width:100%; display:block; image-rendering:pixelated; cursor:crosshair; }
.mark { position:absolute; border:2px solid var(--acc); pointer-events:none; }
.mark.bad { border-color:var(--bad); } .mark.good { border-color:var(--good); }
.mark span { position:absolute; top:-18px; left:-2px; background:#000c; font-size:11px; padding:0 4px; white-space:nowrap; }
#side { width:260px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
#side .row { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
#side button, .nav button { background:#262a36; border:1px solid var(--line); color:var(--ink); padding:5px 10px; border-radius:4px; cursor:pointer; }
#side button.bad { border-color:var(--bad); } #side button.good { border-color:var(--good); }
#side input { width:100%; background:#10121a; border:1px solid var(--line); color:var(--ink); padding:6px; border-radius:4px; }
#list { margin:10px 0 0; padding:0; list-style:none; color:var(--dim); font-size:12px; max-height:300px; overflow:auto; }
.nav { display:flex; gap:8px; justify-content:center; margin-top:12px; }
.done { text-align:center; color:var(--dim); margin-top:60px; }
@media (max-width:600px) { header { flex-wrap:wrap; } #side { width:100%; } }
</style>
</head>
<body>
<header>
  <h1>MAPFORGE</h1>
  <button class="tab on" data-m="blind">Blind</button>
  <button class="tab" data-m="tag">Tag</button>
  <span id="count"></span>
</header>
<main id="main"></main>
<script>
let S = null, mode = 'blind', bi = 0, ti = 0, sel = null, tags = [], t0 = 0;
const M = document.getElementById('main'), C = document.getElementById('count');
const post = a => fetch('/answer', {method:'POST', body:JSON.stringify(a)});

fetch('/set').then(r => r.json()).then(s => {
  S = s;
  const done = new Set(s.done);
  S.todo = s.blind.filter(p => !done.has(p.pid));
  draw();
});
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  mode = b.dataset.m; draw();
});

function draw() { mode === 'blind' ? blind() : tag(); }

function blind() {
  const before = S.blind.length - S.todo.length;  // picked in an earlier visit
  C.textContent = `${before + Math.min(bi, S.todo.length)} / ${S.blind.length} pairs`;
  const p = S.todo[bi];
  const back = `<div class="nav"><button id="bback" ${bi ? '' : 'disabled'}>Back (Backspace)</button></div>`;
  if (!p) { M.innerHTML = '<p class="done">All pairs picked.</p>' + back; hookBack(); return; }
  M.innerHTML = `<p class="q">Scale <b>${p.scale}</b>. Which is the human map? &nbsp;(1 / 2)</p>
    <div class="pair">
      <button class="side" data-c="${p.left}"><img src="/img/${p.left}.png"><span class="k">1</span></button>
      <button class="side" data-c="${p.right}"><img src="/img/${p.right}.png"><span class="k">2</span></button>
    </div>` + back;
  t0 = performance.now();
  M.querySelectorAll('.side').forEach(b => b.onclick = () => pick(b.dataset.c));
  hookBack();
}
// going back re-shows the last pair; a new pick is saved again and the newest pick per pair counts (blind.py score)
function hookBack() { const b = document.getElementById('bback'); if (b) b.onclick = () => { bi = Math.max(0, bi - 1); blind(); }; }
function pick(c) {
  const p = S.todo[bi];
  post({kind:'pick', pid:p.pid, scale:p.scale, pick:c, other:c === p.left ? p.right : p.left,
        ms:Math.round(performance.now() - t0)});
  bi++; blind();
}
document.addEventListener('keydown', e => {
  if (mode !== 'blind' || !S || e.target.tagName === 'INPUT') return;
  if (e.key === 'Backspace') { e.preventDefault(); bi = Math.max(0, bi - 1); blind(); return; }
  if (!S.todo[bi]) return;
  if (e.key === '1' || e.key === 'ArrowLeft') pick(S.todo[bi].left);
  if (e.key === '2' || e.key === 'ArrowRight') pick(S.todo[bi].right);
});

function tag() {
  const id = S.tags[ti];
  C.textContent = `${ti + 1} / ${S.tags.length} crops`;
  if (!id) { M.innerHTML = '<p class="done">All crops seen.</p>'; return; }
  const c = S.crops[id];
  tags = []; sel = null;
  M.innerHTML = `<div id="tagwrap">
    <div id="tagbox"><img id="timg" src="/img/${id}.png"></div>
    <div id="side">
      <div id="tile">Click a tile.</div>
      <div class="row"><button class="bad" data-w="wrong">wrong</button><button class="bad" data-w="ugly">ugly</button>
        <button class="good" data-w="good">good</button></div>
      <input id="why" placeholder="why (Enter saves)">
      <ul id="list"></ul>
      <div class="nav"><button id="prev">Back</button><button id="next">Next</button></div>
    </div></div>`;
  const img = document.getElementById('timg');
  img.onclick = e => {
    const r = img.getBoundingClientRect();
    const tx = Math.floor((e.clientX - r.left) / r.width * c.w), ty = Math.floor((e.clientY - r.top) / r.height * c.h);
    sel = {tx, ty};
    document.getElementById('tile').textContent = `Tile ${tx}, ${ty}`;
    document.getElementById('why').focus();
  };
  M.querySelectorAll('[data-w]').forEach(b => b.onclick = () => save(b.dataset.w));
  document.getElementById('why').onkeydown = e => { if (e.key === 'Enter') save('note'); };
  document.getElementById('next').onclick = () => { ti++; tag(); };
  document.getElementById('prev').onclick = () => { ti = Math.max(0, ti - 1); tag(); };
}
function save(word) {
  if (!sel) return;
  const id = S.tags[ti], c = S.crops[id], why = document.getElementById('why').value.trim();
  // tile offset from the crop's top-left; blind.py adds the map and box, so the map tile is box.x0+tx, box.y1-ty
  post({kind:'tag', crop:id, tx:sel.tx, ty:sel.ty, word, why});
  tags.push({...sel, word, why});
  const box = document.getElementById('tagbox'), img = document.getElementById('timg');
  const m = document.createElement('div');
  m.className = 'mark ' + (word === 'good' ? 'good' : word === 'note' ? '' : 'bad');
  const w = img.clientWidth / c.w, h = img.clientHeight / c.h;
  Object.assign(m.style, {left:sel.tx * w + 'px', top:sel.ty * h + 'px', width:w + 'px', height:h + 'px'});
  m.innerHTML = `<span>${word}</span>`;
  box.appendChild(m);
  const li = document.createElement('li');
  li.textContent = `${sel.tx},${sel.ty} ${word}${why ? ': ' + why : ''}`;
  document.getElementById('list').appendChild(li);
  document.getElementById('why').value = '';
}
</script>
</body>
</html>
