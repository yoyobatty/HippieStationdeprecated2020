[package]
name = "hippie_lighting"
version = "1.0.0"
edition = "2021"
description = "Hippie's lighting engine: works out what each light source lights, and the lighting objects that need redrawing, for SSlighting"

# No dependencies: it talks to BYOND through two functions it looks up in byondcore.dll itself (see src/lib.rs)
[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
panic = "unwind"
